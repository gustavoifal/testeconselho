name: Gerar instalador do Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrir o projeto
        run: Expand-Archive -Path ArrumaAi-projeto.zip -DestinationPath projeto
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        working-directory: projeto/arrumaai
        run: npm ci
      - name: Gerar instalador
        working-directory: projeto/arrumaai
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ArrumaAi-Setup
          path: projeto/arrumaai/release/ArrumaAi-Setup.exe
          if-no-files-found: error
