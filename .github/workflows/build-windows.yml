name: Gerar instalador do Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes automáticos
        run: npm test
      - name: Gerar instalador
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ArrumaAi-Setup
          path: release/ArrumaAi-Setup.exe
          if-no-files-found: error
